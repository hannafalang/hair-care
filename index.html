<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hårpleie</title>
    <link rel="stylesheet" href="base.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="top-section">
        <img src="images/star1.png" alt="Star 1" class="star star1">
        <img src="images/phone.png" alt="Phone" class="phone">
        <div class="nintendo-wrapper">
            <img src="images/nintendo-ds.png" alt="Nintendo-ds" class="Nintendo-ds">
            <div class="ds-screen">
                <h1>Hei, velkommen til hårpleie</h1>
                <h1 id="typing-text"></h1>
            </div>
            <div class="ds-screen2">
                <div>
                    <h2 id="typing-text2"></h2>
                    <div id="answer-output" class="answer-output" aria-live="polite"></div>
                    <button id="restart-button" class="restart-button" type="button" hidden>Start på nytt</button>
                </div>
            </div>
            
            

            <div class="dpad-group" aria-label="Nintendo DS D-pad controls">
                <button class="dpad-button up" type="button" aria-label="Up"></button>
                <button class="dpad-button down" type="button" aria-label="Down"></button>
                <button class="dpad-button left" type="button" aria-label="Left"></button>
                <button class="dpad-button right" type="button" aria-label="Right"></button>
                <div class="dpad-center" aria-hidden="true"></div>
            </div>

            <div class="ds-controls" aria-label="Nintendo DS action buttons">
                <button id="button-x" class="control-button x-btn" type="button" aria-label="X button">X</button>
                <button id="button-y" class="control-button y-btn" type="button" aria-label="Y button">Y</button>
                <button id="button-b" class="control-button b-btn" type="button" aria-label="B button">B</button>
                <button id="button-a" class="control-button a-btn" type="button" aria-label="A button">A</button>
            </div>
        </div>
    </section>

    <script src="hair.js"></script>
</body>
</html>
